name: Validate Docs

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - '.ai-config/scripts/**'
  push:
    branches: [main, develop]

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate all managed docs
        run: node .ai-config/scripts/validate-doc.js all
